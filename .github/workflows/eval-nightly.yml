name: Eval Nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Explicit provider target
        required: true
        default: deepseek
        type: choice
        options:
          - deepseek

permissions:
  contents: read

concurrency:
  group: eval-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Validate target, data, pricing, credential, and hard budgets
        run: >-
          uv run python scripts/preflight_eval_nightly.py
          --target "${{ inputs.target || 'deepseek' }}"
          --output .artifacts/eval/nightly-preflight.json
      - name: Run Provider Live smoke
        run: >-
          uv run python scripts/run_provider_live.py
          --target "${{ inputs.target || 'deepseek' }}"
          --output .artifacts/eval/provider-live.json
      - name: Run bounded Provider nightly sample
        run: >-
          uv run python scripts/run_eval_nightly.py
          --target "${{ inputs.target || 'deepseek' }}"
          --output .artifacts/eval/nightly-run.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ inputs.target || 'deepseek' }}
          path: .artifacts/eval/*.json
          if-no-files-found: error
          retention-days: 14
