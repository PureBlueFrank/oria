name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src/oria

  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest -m "unit or contract"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv build
      - run: uv venv .package-venv --python 3.11
      - run: uv pip install --python .package-venv/bin/python dist/*.whl
      - run: .package-venv/bin/oria --version

  extras-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [standard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --group dev --extra "${{ matrix.extra }}"
      - run: uv run --extra "${{ matrix.extra }}" python -c "import sentence_transformers"
