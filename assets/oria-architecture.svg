      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="contract" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
