<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1110" viewBox="0 0 1500 1110" role="img" aria-labelledby="title description">
  <title id="title">Oria 分层与插件化架构</title>
  <desc id="description">展示 Oria 的接入层、编排与运行时、核心能力、插件契约、可替换实现、基础设施与外部系统，以及贯穿各层的治理控制面。</desc>

  <defs>
