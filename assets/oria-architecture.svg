      .subtitle { fill: #64748B; font-size: 16px; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
      .layer-title { fill: #0F172A; font-size: 21px; font-weight: 700; }
      .layer-en { fill: #64748B; font-size: 11px; font-weight: 700; letter-spacing: 1.25px; }
      .card-title { fill: #0F172A; font-size: 17px; font-weight: 700; }
      .card-copy { fill: #64748B; font-size: 13px; }
      .small-title { fill: #0F172A; font-size: 15px; font-weight: 700; }
      .small-copy { fill: #64748B; font-size: 12px; }
      .gov-title { fill: #FFFFFF; font-size: 18px; font-weight: 700; }
